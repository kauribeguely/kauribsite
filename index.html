      const orders = ["rog", "rwr", "rogwr", "rogogr", "r", "rwwr"];

      const jsOrders = ["pwo", "pb", "porbg", "rrbg", "pbw", "ppwo"];

      // const activeOrders = jsOrders;
      const activeOrders = orders;

      const lineNum = 10;

      const maxWidth = 80;
      const minWidth = 20;
      const maxRedWidth = 40;
      const minRedWidth = 15;



      // const container1 = document.querySelector('.hero-right');
      const container1 = document.querySelector('.code-loading');

      generateCodeIllustration(container1, orders);

      function generateCodeIllustration(container, ordersList)
      {
          let addDelay = 0;
          let currentIndent = 0;



          // create blocks in a line then go new line and repeat

           // r o g, r w r, r o g w r,
            //choose random order from above

            //each line
            for(let i = 0; i < lineNum; i++)
            {
              let lineDiv = document.createElement('div');
              lineDiv.classList.add('div-line');
              // const order = activeOrders[Math.floor(Math.random() * activeOrders.length)];
              const order = ordersList[Math.floor(Math.random() * ordersList.length)];
              for(let block = 0; block < order.length; block++)
              {
                const blockType = order.charAt(block);
                const element = makeBlockFromLetter(blockType);

                let maxW = maxWidth;
                let minW = minWidth;

                if(blockType == 'r' || blockType == 'p')
                {
                  maxW = maxRedWidth;
                  minW = minRedWidth;
                }
                else if(blockType == 'w')
                {
                  maxW = 80;
                  minW = 50;
                }

                const randomWidth = Math.random() * maxW + minW;
                element.style.width = randomWidth + 'px';


                lineDiv.append(element);
                setTimeout(function(){element.style.opacity = '1.0';}, addDelay);
                // setTimeout(function(){lineDiv.append(element);}, addDelay);
                addDelay += Math.random()*150 + 20;
                // lineDiv.append(element);
              }
              lineDiv.style.marginLeft = currentIndent + 'px';

              const plusOrMinus = Math.random() < 0.5 ? -1 : 1;
              currentIndent += plusOrMinus * indentWidth;
              if(currentIndent < 0) currentIndent = 20;
              if(currentIndent > (4 * indentWidth)) currentIndent = (4 * indentWidth);

              // container.insertBefore(lineDiv, codingMessage);
              container.appendChild(lineDiv);
            }

         }

         // e.g. for(lineNum, () = > { do something })

         function makeBlockFromLetter(letter)
         {
           //e06c75 red, 9da5b4 gray, c57c36 orange, 73bc66 green, 5fabe9 blue


           let block = document.createElement('div');
           block.classList.add('code-block');

           let color;
           switch(letter) {
            case 'r':
              color = '#e06c75';
              break;
            case 'o':
              color = 'var(--yorange)';
              break;
            case 'g':
              color = '#73bc66';
              break;
            case 'w':
              // color = 'var(--white)';
              color = '#bbbbbb';
              break;
            case 'b':
              color = '#5fabe9';
              break;
            case 'p':
              color = '#c14cc1';
              break;
           }
           block.style.backgroundColor = color;
           return block;
       }
  </script>

    <script type="module">

              -3 * aspect, // left

              -3,          // bottom
              0.1,         // near
              1000         // far
          );
          orthographicCamera.position.set(5, 5, 5);
          orthographicCamera.lookAt(0, 0, 0);
          let camera = orthographicCamera;


          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, });
          renderer.setClearColor(0x000000, 0);
          renderer.setSize(canvas.clientWidth, canvas.clientHeight);
          // renderer.outputEncoding = THREE.sRGBEncoding;

          const directionalLight = new THREE.DirectionalLight(0xffffff, 3); // Color (white) and intensity (1)

          scene.add(amb);

          // Isometric Camera Setup
          camera.position.set(5, 5, 5);

          document.onmousemove = function(event) {
              // Get mouse coordinates
              let mouseX = event.clientX;
              let mouseY = event.clientY;

              // Get window dimensions
              let windowWidth = window.innerWidth;
              let windowHeight = window.innerHeight;

              // Normalize mouse coordinates to a range of 0 to 1
              let normalizedMouseX = mouseX / windowWidth;
              let normalizedMouseY = mouseY / windowHeight;
              let centeredX = normalizedMouseX - 0.5;
              let centeredY = normalizedMouseY - 0.5;

              // Map normalized coordinates to your desired ranges
              let cursorX = mapRange(normalizedMouseX, 0, 1, -1.83, 1.93);
              let cursorY = mapRange(normalizedMouseY, 0, 1, 1.727, -0.288);

              // Update cursor position (assuming 'cursor' is your Three.js cursor object)
              if (cursor) {
                  cursor.position.x = cursorX;
                  cursor.position.y = cursorY;
              }

              // Rotate the model group
              if (allModels) {
                  // allModels.rotation.x = normalizedMouseY * Math.PI * 5 / 180; // 5 degrees rotation
                  allModels.rotation.x = centeredY * rad(15) + rad(-15); // 5 degrees rotation
                  allModels.rotation.y = centeredX * rad(15);
                  phone.rotation.z = centeredX * rad(-15); // 5 degrees rotation
                  phone.rotation.y = centeredX * rad(-15);
              }
          };


          function rad(deg)
          {
            return deg * (Math.PI / 180);
          }
          // Helper function to map a value from one range to another
          function mapRange(value, inMin, inMax, outMin, outMax) {
              return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
          }

          function animate() {
              requestAnimationFrame(animate);
              controls.update(); // Update OrbitControls
              renderer.render(scene, camera);
          }

          animate();


      }


      // Function to change the screenMat texture (emissive)
      function changeScreenTexture(imageUrl) {
          if (screenMaterial) {
              textureLoader.load(imageUrl, function (texture) {
                texture.colorSpace = THREE.SRGBColorSpace; // Use colorSpace instead of encoding (Three.js r152+)

                  texture.flipY = false;
                  screenMaterial.emissiveMap = texture; // Use emissiveMap
                  screenMaterial.needsUpdate = true;
                  // console.log('CHANGE TEXTURE');
                  // printMaterialProperties(screenMaterial);

              }, undefined, function (error) {
                  console.error('Error loading texture:', error);
              });
          } else {
              console.error('screenMat material is not available.');
          }
      }
